<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pass It On — The One Where</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background-color: #f3f4f6;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
    }
    .page-header {
      padding: var(--spacing-md) var(--spacing-lg);
      background: white;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .back-link {
      color: var(--accent-color);
      text-decoration: none;
      font-weight: 500;
    }
    .back-link:hover { text-decoration: underline; }
    
    .split-layout {
      display: flex;
      height: calc(100vh - 65px);
    }
    
    .pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: var(--spacing-lg);
      overflow-y: auto;
    }
    
    .pane-left {
      background: white;
      border-right: 1px solid var(--border-color);
    }
    
    .pane-right {
      background: #f9fafb;
      position: relative;
    }
    
    .pane-right.inactive::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(249, 250, 251, 0.8);
      z-index: 10;
    }
    
    .pane-header {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: var(--spacing-lg);
      color: #374151;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: var(--spacing-sm);
    }
    
    .scenario-toggle {
      display: flex;
      gap: 10px;
      margin-bottom: var(--spacing-lg);
    }
    
    .scenario-btn {
      padding: 6px 12px;
      border: 1px solid var(--border-color);
      background: white;
      border-radius: var(--border-radius-md);
      cursor: pointer;
    }
    .scenario-btn.active {
      background: var(--accent-color);
      color: white;
      border-color: var(--accent-color);
    }
    
    .conversation-thread {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: var(--spacing-md);
    }
    
    .action-btn {
      margin-top: var(--spacing-lg);
      padding: 12px;
      background: var(--accent-color);
      color: white;
      border: none;
      border-radius: 9999px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }
    .action-btn:hover { background: #2563eb; }
    
    .crop-preview {
      width: 100%;
      height: 200px;
      border-radius: var(--border-radius-lg);
      overflow: hidden;
      margin-bottom: var(--spacing-md);
      border: 2px solid var(--border-color);
    }
    
    .crop-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      /* Zoom to a genuine detail. Without this the full frame stays legible
         (including any text in the photo) and Amit reads rather than remembers. */
      transform: scale(4.2);
      will-change: transform;
    }

    /* A deliberate annotation, visually separate from the product surface. */
    .how-note {
      margin-top: var(--spacing-md);
      padding: 12px 14px;
      border-left: 3px solid var(--border-color);
      background: transparent;
      font-size: 0.8rem;
      line-height: 1.5;
      color: #6b7280;
    }
    .how-note b {
      display: block;
      font-size: 0.7rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 4px;
      color: #9aa0a6;
      font-weight: 600;
    }
    
    .question-box {
      background: white;
      padding: var(--spacing-lg);
      border-radius: var(--border-radius-lg);
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    
    .question-text {
      font-size: 1.1rem;
      font-weight: 500;
      margin-bottom: var(--spacing-md);
    }
    
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-sm);
    }
    
    .option-btn {
      padding: 10px;
      background: #f3f4f6;
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius-md);
      cursor: pointer;
      text-align: left;
    }
    .option-btn:hover { background: #e5e7eb; }
    
    .freeform-input {
      margin-top: var(--spacing-sm);
      display: flex;
      gap: 8px;
    }
    
    .freeform-input input {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius-md);
    }
    .freeform-input button {
      padding: 10px 16px;
      background: var(--accent-color);
      color: white;
      border: none;
      border-radius: var(--border-radius-md);
      cursor: pointer;
    }
    
    /* Animation for re-ranking */
    .re-ranking .thumbnail-wrapper {
      transition: transform 0.5s ease, opacity 0.5s ease;
    }
  </style>
</head>
<body>
<header class="page-header">
    <h1>Pass It On (Social Handoff)</h1>
    <a href="index.html" class="back-link">← Back to search</a>
  </header>
  
  <div class="split-layout">
    <!-- Left Pane (You) -->
    <div class="pane pane-left">
      <div class="pane-header">Your Device</div>
      
      <div class="scenario-toggle">
        <button id="scenario-1" class="scenario-btn active">Scenario: The Trek (Stalled)</button>
        <button id="scenario-2" class="scenario-btn">Scenario: Hampi Café (Disagreement)</button>
      </div>
      
      <div id="left-thread" class="conversation-thread">
        <!-- Rendered by JS -->
      </div>
      
      <button id="ask-amit-btn" class="action-btn">Ask Amit — he was there</button>
    </div>
    
    <!-- Right Pane (Amit) -->
    <div id="right-pane" class="pane pane-right inactive">
      <div class="pane-header">Amit's Device</div>
      <div id="right-content">
        <!-- Rendered by JS -->
      </div>
    </div>
  </div>
  
  <script src="js/idb.js"></script>
  <script src="js/catalogue.js"></script>
  <script src="js/render.js"></script>
  <script src="js/deposits.js"></script>
  <script src="js/passiton.js"></script>
  <script src="js/nav.js"></script>
</body>
</html>
