<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Library — The One Where</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .lib-head{padding:18px var(--spacing-md) 10px;border-bottom:1px solid var(--border-color,#e8eaed)}
    .lib-head h1{font-size:1.15rem;font-weight:600;margin:0}
    .lib-head p{margin:3px 0 0;font-size:.8rem;line-height:1.45;color:#5f6368;max-width:48ch}
    .lib-stats{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:9px;
      font-size:.72rem;color:#5f6368;font-variant-numeric:tabular-nums}
    .lib-stats b{color:var(--on-surface,#202124);font-weight:600}

    .lib-body{flex:1;min-height:0;overflow-y:auto;padding:4px var(--spacing-md) 20px}
    .grp{margin-top:20px}
    .grp > h2{font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;
      color:#9aa0a6;font-weight:600;margin:0 0 3px}
    .grp > p{margin:0 0 10px;font-size:.78rem;color:#5f6368;line-height:1.45}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
    .cell{position:relative;aspect-ratio:1;border-radius:9px;overflow:hidden;
      background:var(--surface-container-low,#f4f3f6);cursor:pointer;border:0;padding:0}
    /* A missing file must not let alt text expand the cell and break the grid. */
    .cell{font-size:0;color:transparent}
    .cell img{width:100%;height:100%;object-fit:cover;display:block}
    .cell .kind{position:absolute;top:5px;left:5px;font-size:.58rem;color:#fff;letter-spacing:.05em;
      text-transform:uppercase;font-weight:600;background:rgba(0,0,0,.62);color:#fff;
      padding:2px 6px;border-radius:999px}
    .cell:focus-visible{outline:2px solid var(--accent-color,#1967d2);outline-offset:2px}

    .sheet{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;
      align-items:flex-end;justify-content:center;z-index:60}
    .sheet[hidden]{display:none}
    .sheet-inner{background:var(--surface-container-lowest,#fff);width:100%;max-width:414px;
      border-radius:20px 20px 0 0;padding:16px;max-height:88vh;overflow-y:auto}
    .sheet-inner img{width:100%;border-radius:12px;display:block;margin-bottom:12px}
    .sheet-inner h3{margin:0 0 4px;font-size:1rem;font-weight:600}
    .sheet-inner dl{margin:10px 0 0;font-size:.82rem;display:grid;
      grid-template-columns:auto 1fr;gap:5px 12px}
    .sheet-inner dt{color:#9aa0a6;font-size:.68rem;letter-spacing:.06em;
      text-transform:uppercase;font-weight:600;padding-top:2px}
    .sheet-inner dd{margin:0}
    .sheet-close{margin-top:14px;width:100%;padding:10px;border-radius:999px;border:0;
      background:var(--surface-container,#eeedf1);font:inherit;font-weight:500;cursor:pointer}
    .try{display:inline-block;margin-top:12px;font-size:.82rem;
      color:var(--accent-color,#1967d2);text-decoration:underline;cursor:pointer;
      background:none;border:0;padding:0;font-family:inherit}
  </style>
</head>
<body>
  <div id="app-wrapper">
    <div class="lib-head">
      <h1>The library</h1>
      <p>Everything the demo searches. Have a look, then go to Find and search for
         something you saw here &mdash; vaguely, the way you'd actually remember it.</p>
      <div class="lib-stats" id="stats"></div>
    </div>

    <div class="lib-body" id="lib"></div>
  </div>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-inner" id="sheet-inner"></div>
  </div>

  <script src="js/idb.js"></script>
  <script src="js/catalogue.js"></script>
  <script>
  (async function () {
    const mode = window.catalogue.getMode();
    const recs = await window.catalogue.loadCatalogue(mode);
    const $ = id => document.getElementById(id);
    const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g,
      c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

    // Say plainly whose photos these are. Browsing the demo grid while the
    // engine is searching your uploads was the exact confusion that cost an
    // evening, and this page is where it would bite hardest.
    if (mode === 'user') {
      document.querySelector('.lib-head h1').textContent = 'Your photos';
      document.querySelector('.lib-head p').innerHTML =
        'The photos you uploaded. They stay on this device. Go to Find and search ' +
        'for one of them &mdash; vaguely, the way you\'d actually remember it.';
    }

    if (!recs.length) {
      document.getElementById('stats').innerHTML =
        '<span>' + (mode === 'user' ? 'Nothing uploaded yet.' : 'The library is empty.') + '</span>';
      document.getElementById('lib').innerHTML =
        '<div class="grp"><p>' + (mode === 'user'
          ? 'Go to Find and choose &ldquo;Use your own photos&rdquo; to add some.'
          : 'No records were loaded.') +
        '</p><p style="margin-top:10px"><a href="index.html" style="color:var(--accent-color,#1967d2)">Back to Find &rarr;</a></p></div>';
      return;
    }

    const kinds = {};
    recs.forEach(r => kinds[r.kind] = (kinds[r.kind] || 0) + 1);
    const years = recs.map(r => r.taken_at).filter(Boolean).sort();
    $('stats').innerHTML =
      '<span><b>' + recs.length + '</b> items</span>' +
      Object.entries(kinds).sort((a,b)=>b[1]-a[1])
        .map(([k,n]) => '<span><b>' + n + '</b> ' + esc(k.replace('_',' ')) + (n>1?'s':'') + '</span>').join('') +
      (years.length ? '<span><b>' + years[0].slice(0,4) + '–' + years[years.length-1].slice(0,4) + '</b></span>' : '');

    // Near-identical sets are grouped and labelled, because a viewer needs to
    // understand that they exist before a search over them means anything.
    const sets = {};
    const singles = [];
    recs.forEach(r => {
      if (r.cluster && r.near_identical) (sets[r.cluster] = sets[r.cluster] || []).push(r);
      else singles.push(r);
    });

    const dateLine = r => {
      if (!r.taken_at) return 'date unknown';
      const d = new Date(r.taken_at);
      return d.toLocaleDateString('en-IN', { day:'numeric', month:'long', year:'numeric' });
    };

    const cell = r =>
      '<button class="cell" data-id="' + esc(r.id) + '">' +
      '<img loading="lazy" src="' + esc(window.catalogue.getImageURL(r.id, mode)) + '" alt="' + esc(r.scene || '') + '">' +
      (r.kind !== 'photo' ? '<span class="kind">' + esc(r.kind.replace('_',' ')) + '</span>' : '') +
      '</button>';

    let html = '';
    const setNames = Object.keys(sets);
    if (setNames.length) {
      html += '<div class="grp"><h2>Sets that look alike</h2>' +
        '<p>' + (mode === 'user'
          ? 'Photos taken within a minute of each other &mdash; your own bursts. They are the hard case: you remember one frame, and from a thumbnail they are nearly impossible to tell apart.'
          : 'Each of these is one moment shot several times. They are the hard case: you remember one frame, and from a thumbnail they are nearly impossible to tell apart.') + '</p>';
      setNames.forEach(c => { html += '<div style="margin-bottom:10px"><div class="grid">' +
        sets[c].map(cell).join('') + '</div></div>'; });
      html += '</div>';
    }
    html += '<div class="grp"><h2>Everything else</h2>' +
      '<p>Ordinary library: trips, food, family, documents, screenshots, a few accidents.</p>' +
      '<div class="grid">' + singles.map(cell).join('') + '</div></div>';
    $('lib').innerHTML = html;

    $('lib').addEventListener('click', e => {
      const b = e.target.closest('.cell'); if (!b) return;
      const r = recs.find(x => x.id === b.dataset.id); if (!r) return;
      $('sheet-inner').innerHTML =
        '<img src="' + esc(window.catalogue.getImageURL(r.id, mode)) + '" alt="">' +
        '<h3>' + esc(r.scene || '') + '</h3>' +
        '<dl>' +
        '<dt>When</dt><dd>' + esc(dateLine(r)) + '</dd>' +
        (r.place ? '<dt>Where</dt><dd>' + esc(r.place.name || '') + '</dd>' : '') +
        (r.people && r.people.length ? '<dt>Who</dt><dd>' + esc(r.people.join(', ')) + '</dd>' : '') +
        '<dt>Kind</dt><dd>' + esc(r.kind.replace('_',' ')) + '</dd>' +
        '</dl>' +
        '<button class="try" id="try-this">Search for this one →</button>' +
        '<button class="sheet-close" id="sheet-close">Close</button>';
      $('sheet').hidden = false;
      // Hands a deliberately vague version of this photo to the search, which is
      // how someone actually remembers it - not the full scene description.
      $('try-this').addEventListener('click', () => {
        const words = (r.scene || '').split(/[\s,]+/).filter(w => w.length > 3).slice(0, 4).join(' ');
        location.href = 'index.html?q=' + encodeURIComponent(words);
      });
      $('sheet-close').addEventListener('click', () => { $('sheet').hidden = true; });
    });
    $('sheet').addEventListener('click', e => { if (e.target.id === 'sheet') $('sheet').hidden = true; });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') $('sheet').hidden = true; });
  })();
  </script>
  <script src="js/nav.js"></script>
</body>
</html>
